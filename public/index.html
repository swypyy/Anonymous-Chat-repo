<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swypyy Messenger</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg-color: #090712;
      --card-bg: rgba(22, 17, 38, 0.7);
      --border-color: rgba(139, 92, 246, 0.2);
      --purple-primary: #7c3aed;
      --purple-hover: #6d28d9;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px;
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .brand {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand h1 {
      font-size: 1.75rem;
      font-weight: 700;
      background: linear-gradient(135deg, #c084fc, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0 0 6px 0;
    }

    .brand p {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin: 0;
    }

    .hidden {
      display: none !important;
    }

    .input-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(15, 12, 27, 0.8);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--purple-primary);
    }

    button {
      width: 100%;
      padding: 12px 16px;
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.4);
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 4px;
    }

    button:active {
      transform: scale(0.98);
    }

    button:hover {
      opacity: 0.9;
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 20px 0;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border-color);
    }

    .divider::before { margin-right: 10px; }
    .divider::after { margin-left: 10px; }

    /* Chat Room Styles */
    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .room-badge {
      background: rgba(139, 92, 246, 0.15);
      color: #c084fc;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    #chat-box {
      height: 50vh;
      overflow-y: auto;
      padding: 10px;
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 0.9rem;
      word-break: break-word;
      line-height: 1.4;
    }

    .msg.system {
      align-self: center;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      font-size: 0.75rem;
      border-radius: 8px;
      text-align: center;
      max-width: 100%;
      width: 100%;
    }

    .msg.incoming {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.08);
      border-bottom-left-radius: 4px;
    }

    .msg.outgoing {
      align-self: flex-end;
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg-sender {
      font-size: 0.7rem;
      font-weight: 600;
      color: #c084fc;
      margin-bottom: 3px;
    }

    .chat-input-area {
      display: flex;
      gap: 8px;
    }

    .chat-input-area input {
      margin: 0;
    }

    .chat-input-area button {
      width: auto;
      margin: 0;
      padding: 0 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      
      <!-- SETUP SCREEN -->
      <div id="setup-screen">
        <div class="brand">
          <h1>Swypyy Messenger</h1>
          <p>Secure, ephemeral rooms that vanish when closed</p>
        </div>

        <!-- CREATE SECTION -->
        <div class="input-group">
          <label>Your Name (Host)</label>
          <input id="host-username" placeholder="Enter your display name" />
        </div>
        <button onclick="createRoom()">Create Room</button>

        <div class="divider">OR JOIN</div>

        <!-- JOIN SECTION -->
        <div class="input-group">
          <label>Your Name (Guest)</label>
          <input id="guest-username" placeholder="Enter your display name" style="margin-bottom: 10px;" />
          <label>Room Code</label>
          <input id="room-code-input" placeholder="e.g. X7K2P9" />
        </div>
        <button onclick="joinRoom()" style="background: rgba(255,255,255,0.08); border: 1px solid var(--border-color); box-shadow: none;">Join Room</button>
      </div>

      <!-- CHAT ROOM SCREEN -->
      <div id="chat-screen" class="hidden">
        <div class="chat-header">
          <div>
            <div style="font-size: 0.8rem; color: var(--text-muted);">Active Session</div>
            <div id="room-header" style="font-weight: 600; font-size: 0.95rem;"></div>
          </div>
          <div class="room-badge" id="role-badge">Member</div>
        </div>

        <div id="chat-box"></div>

        <div class="chat-input-area">
          <input id="message-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage()" />
          <button onclick="sendMessage()">Send</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    const socket = io();
    let currentUser = '';

    function createRoom() {
      currentUser = document.getElementById('host-username').value.trim() || 'Host';
      socket.emit('create-room', { username: currentUser });
    }

    function joinRoom() {
      const guestNameInput = document.getElementById('guest-username').value.trim();
      const codeInput = document.getElementById('room-code-input').value.toUpperCase().trim();

      if (!codeInput) {
        alert('Please enter a room code');
        return;
      }

      currentUser = guestNameInput || 'Guest';
      
      showChat(`Code: ${codeInput}`, currentUser);
      socket.emit('join-room', { code: codeInput, username: currentUser });
    }

    function sendMessage() {
      const input = document.getElementById('message-input');
      if (!input.value.trim()) return;
      
      const text = input.value;
      appendMsg(currentUser, text, 'outgoing');
      
      socket.emit('send-message', { text, sender: currentUser });
      input.value = '';
    }

    // Server Listeners
    socket.on('room-created', ({ code }) => {
      showChat(`Code: ${code}`, currentUser);
    });

    socket.on('user-joined', ({ username }) => {
      appendMsg('System', `${username} entered the room.`, 'system');
    });

    socket.on('new-message', ({ text, sender }) => {
      if (sender !== currentUser) {
        appendMsg(sender, text, 'incoming');
      }
    });

    socket.on('room-destroyed', (reason) => {
      alert(reason);
      location.reload();
    });

    socket.on('error-msg', (msg) => alert(msg));

    function showChat(headerText, nameTag) {
      document.getElementById('setup-screen').classList.add('hidden');
      document.getElementById('chat-screen').classList.remove('hidden');
      document.getElementById('room-header').innerText = headerText;
      document.getElementById('role-badge').innerText = nameTag;
    }

    function appendMsg(sender, text, type) {
      const box = document.getElementById('chat-box');
      let msgHTML = '';
      
      if (type === 'system') {
        msgHTML = `<div class="msg system">${text}</div>`;
      } else if (type === 'outgoing') {
        msgHTML = `<div class="msg outgoing">${text}</div>`;
      } else {
        msgHTML = `<div class="msg incoming">
                     <div class="msg-sender">${sender}</div>
                     ${text}
                   </div>`;
      }
      
      box.innerHTML += msgHTML;
      box.scrollTop = box.scrollHeight;
    }
  </script>
</body>
  </html>
