<script>
  const socket = io();
  let currentUser = '';

  function createRoom() {
    currentUser = document.getElementById('username').value || 'Host';
    socket.emit('create-room', { username: currentUser });
  }

  function joinRoom() {
    const usernameInput = document.getElementById('username').value;
    const codeInput = document.getElementById('room-code-input').value.toUpperCase().trim();

    if (!codeInput) {
      alert('Please enter a room code');
      return;
    }

    currentUser = usernameInput || 'Guest';
    
    // Switch the screen immediately on the PC when clicking join
    showChat(`Room Code: ${codeInput}`);
    
    // Send join request to server
    socket.emit('join-room', { code: codeInput, username: currentUser });
  }

  function sendMessage() {
    const input = document.getElementById('message-input');
    if (!input.value) return;
    socket.emit('send-message', { text: input.value, sender: currentUser });
    input.value = '';
  }

  // Server Listeners
  socket.on('room-created', ({ code }) => {
    showChat(`Room Code: ${code} (Share this)`);
  });

  socket.on('user-joined', ({ username }) => {
    appendMsg('System', `${username} entered the room.`);
  });

  socket.on('new-message', ({ text, sender }) => {
    appendMsg(sender, text);
  });

  socket.on('room-destroyed', (reason) => {
    alert(reason);
    location.reload();
  });

  socket.on('error-msg', (msg) => alert(msg));

  function showChat(headerText) {
    document.getElementById('setup-screen').classList.add('hidden');
    document.getElementById('chat-screen').classList.remove('hidden');
    document.getElementById('room-header').innerText = headerText;
  }

  function appendMsg(sender, text) {
    const box = document.getElementById('chat-box');
    box.innerHTML += `<div class="msg"><strong>${sender}:</strong> ${text}</div>`;
    box.scrollTop = box.scrollHeight;
  }
</script>
