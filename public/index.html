<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Swypyy Messenger</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg-color: #090712;
      --card-bg: rgba(22, 17, 38, 0.9);
      --border-color: rgba(139, 92, 246, 0.2);
      --purple-primary: #7c3aed;
      --purple-hover: #6d28d9;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --danger-color: #ef4444;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }

    .hidden {
      display: none !important;
    }

    /* SETUP SCREEN (CENTERED CARD) */
    #setup-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .brand {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand h1 {
      font-size: 1.75rem;
      font-weight: 700;
      background: linear-gradient(135deg, #c084fc, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0 0 6px 0;
    }

    .brand p {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin: 0;
    }

    .input-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(15, 12, 27, 0.8);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--purple-primary);
    }

    button {
      width: 100%;
      padding: 12px 16px;
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.4);
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 4px;
    }

    button:active {
      transform: scale(0.98);
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 20px 0;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border-color);
    }

    .divider::before { margin-right: 10px; }
    .divider::after { margin-left: 10px; }


    /* FULL SCREEN CHAT INTERFACE */
    #chat-screen {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #090712;
    }

    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: rgba(22, 17, 38, 0.95);
      border-bottom: 1px solid var(--border-color);
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .room-title-area {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .share-btn {
      background: rgba(139, 92, 246, 0.15);
      color: #c084fc;
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin: 0;
      width: auto;
      box-shadow: none;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .room-badge {
      background: rgba(139, 92, 246, 0.2);
      color: #c084fc;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .exit-btn {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger-color);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      margin: 0;
      box-shadow: none;
      width: auto;
    }

    .exit-btn:hover {
      background: rgba(239, 68, 68, 0.25);
    }

    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #090712;
    }

    .msg {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.95rem;
      word-break: break-word;
      line-height: 1.4;
    }

    .msg.system {
      align-self: center;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      font-size: 0.75rem;
      border-radius: 20px;
      padding: 6px 14px;
      text-align: center;
      margin: 8px 0;
    }

    .msg.incoming {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.08);
      border-bottom-left-radius: 4px;
      color: #fff;
    }

    .msg.outgoing {
      align-self: flex-end;
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg-sender {
      font-size: 0.72rem;
      font-weight: 600;
      color: #c084fc;
      margin-bottom: 3px;
    }

    .chat-input-area {
      display: flex;
      gap: 10px;
      padding: 12px 16px;
      background: rgba(22, 17, 38, 0.95);
      border-top: 1px solid var(--border-color);
      align-items: center;
    }

    .chat-input-area input {
      flex: 1;
      margin: 0;
      border-radius: 24px;
      padding: 12px 18px;
    }

    .chat-input-area button {
      width: auto;
      margin: 0;
      padding: 12px 22px;
      border-radius: 24px;
    }
  </style>
</head>
<body>

  <!-- SETUP SCREEN -->
  <div id="setup-container">
    <div class="card">
      <div class="brand">
        <h1>Swypyy Messenger</h1>
        <p>Secure, ephemeral rooms that vanish when closed</p>
      </div>

      <!-- CREATE SECTION -->
      <div class="input-group">
        <label>Your Name (Host)</label>
        <input id="host-username" placeholder="Enter your display name" />
      </div>
      <button onclick="createRoom()">Create Room</button>

      <div class="divider">OR JOIN</div>

      <!-- JOIN SECTION -->
      <div class="input-group">
        <label>Your Name (Guest)</label>
        <input id="guest-username" placeholder="Enter your display name" style="margin-bottom: 10px;" />
        <label>Room Code</label>
        <input id="room-code-input" placeholder="e.g. X7K2P9" />
      </div>
      <button onclick="joinRoom()" style="background: rgba(255,255,255,0.08); border: 1px solid var(--border-color); box-shadow: none;">Join Room</button>
    </div>
  </div>

  <!-- FULL SCREEN CHAT ROOM -->
  <div id="chat-screen" class="hidden">
    <div class="chat-header">
      <div>
        <div style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;">Active Session</div>
        <div class="room-title-area">
          <div id="room-header" style="font-weight: 700; font-size: 1.1rem; color: #fff;"></div>
          <button class="share-btn" onclick="shareRoomCode()">🔗 Share</button>
        </div>
      </div>
      <div class="header-actions">
        <div class="room-badge" id="role-badge">Member</div>
        <button class="exit-btn" onclick="exitRoom()">Exit</button>
      </div>
    </div>

    <div id="chat-box"></div>

    <div class="chat-input-area">
      <input id="message-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage()" />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const socket = io();
    let currentUser = '';
    let currentRoomCode = '';

    function createRoom() {
      currentUser = document.getElementById('host-username').value.trim() || 'Host';
      socket.emit('create-room', { username: currentUser });
    }

    function joinRoom() {
      const guestNameInput = document.getElementById('guest-username').value.trim();
      const codeInput = document.getElementById('room-code-input').value.toUpperCase().trim();

      if (!codeInput) {
        alert('Please enter a room code');
        return;
      }

      currentUser = guestNameInput || 'Guest';
      currentRoomCode = codeInput;
      
      showChat(`Code: ${codeInput}`, currentUser);
      socket.emit('join-room', { code: codeInput, username: currentUser });
    }

    function sendMessage() {
      const input = document.getElementById('message-input');
      if (!input.value.trim()) return;
      
      const text = input.value;
      appendMsg(currentUser, text, 'outgoing');
      
      socket.emit('send-message', { text, sender: currentUser });
      input.value = '';
    }

    function shareRoomCode() {
      if (!currentRoomCode) return;
      
      const shareData = {
        title: 'Swypyy Messenger Invite',
        text: `Join my private ephemeral chat session on Swypyy Messenger!\nRoom Code: ${currentRoomCode}\nWebsite: ${window.location.href}`,
        url: window.location.href
      };

      if (navigator.share) {
        navigator.share(shareData).catch(() => {});
      } else {
        // Fallback: Copy to clipboard
        navigator.clipboard.writeText(`Room Code: ${currentRoomCode}\nJoin here: ${window.location.href}`);
        alert(`Room Code copied: ${currentRoomCode}`);
      }
    }

    function exitRoom() {
      if (confirm('Are you sure you want to leave the room?')) {
        location.reload();
      }
    }

    // Server Listeners
    socket.on('room-created', ({ code }) => {
      currentRoomCode = code;
      showChat(`Code: ${code}`, currentUser);
    });

    socket.on('user-joined', ({ username }) => {
      appendMsg('System', `${username} entered the room.`, 'system');
    });

    socket.on('new-message', ({ text, sender }) => {
      if (sender !== currentUser) {
        appendMsg(sender, text, 'incoming');
      }
    });

    socket.on('room-destroyed', (reason) => {
      alert(reason);
      location.reload();
    });

    socket.on('error-msg', (msg) => alert(msg));

    function showChat(headerText, nameTag) {
      document.getElementById('setup-container').classList.add('hidden');
      document.getElementById('chat-screen').classList.remove('hidden');
      document.getElementById('room-header').innerText = headerText;
      document.getElementById('role-badge').innerText = nameTag;
    }

    function appendMsg(sender, text, type) {
      const box = document.getElementById('chat-box');
      let msgHTML = '';
      
      if (type === 'system') {
        msgHTML = `<div class="msg system">${text}</div>`;
      } else if (type === 'outgoing') {
        msgHTML = `<div class="msg outgoing">${text}</div>`;
      } else {
        msgHTML = `<div class="msg incoming">
                     <div class="msg-sender">${sender}</div>
                     ${text}
                   </div>`;
      }
      
      box.innerHTML += msgHTML;
      box.scrollTop = box.scrollHeight;
    }
  </script>
</body>
  </html>
